name: By-Module Check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'by-module.md'
      - 'by-module.zh-CN.md'
      - 'scripts/by-module.json'
      - 'scripts/build-by-module.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check by-module views are in sync with the READMEs
        run: python3 scripts/build-by-module.py --check
